[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-ros"
dynamic = ["version"]
description = "Loop Robot Operating System: a terminal-first robotics agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["prompt-toolkit>=3.0.50,<4", "pyserial>=3.5,<4; sys_platform == 'win32' or sys_platform == 'darwin'"]

[project.optional-dependencies]
feetech = ["pyserial>=3.5,<4"]
sim = ["mujoco>=3.3,<4", "numpy>=1.26"]
kinematics = ["mink>=1,<2"]
mcp = ["mcp>=1.12,<2"]
dataset = ["h5py>=3.10", "numpy>=1.26"]
learning = ["gymnasium>=1,<2", "h5py>=3.10", "numpy>=1.26"]
test = ["pyte>=0.8,<1"]

[project.scripts]
loop = "loop_robot.launcher:main"
loop-switch = "loop_robot.launcher:switch_main"
looper = "loop_robot.launcher:main"
looper-switch = "loop_robot.launcher:switch_main"

[tool.setuptools]
packages = ["loop_robot", "loop_robot.core", "loop_robot.terminal", "loop_robot.toolchain"]
package-dir = {loop_robot = "."}
include-package-data = false

[tool.setuptools.package-data]
loop_robot = ["configs/ros/ros2-observer.example.json", "configs/ros/ros1-observer.example.json", "configs/ros/ros2-slam.example.json", "configs/config.example.json", "configs/config.gpt6.example.json", "configs/workflow_harness.md", "configs/agents.json", "configs/task_runtime.json", "configs/skills/isaac-scene-builder/SKILL.md", "configs/skills/mujoco-scene-builder/SKILL.md", "configs/skills/simulation-learning-data/SKILL.md", "scripts/install_sim_skills.py", "configs/mcp.simulation.example.json", "assets/logo.png", "assets/simulation/two_joint.xml", "assets/simulation/simulation_workbench.xml", "assets/workbench/workbench.html", "assets/workbench/workbench.css", "assets/workbench/workbench.js", "assets/workbench/three.module.min.js", "assets/workbench/three.LICENSE.txt"]
"loop_robot.toolchain" = ["hardware_targets.json"]

[tool.setuptools.dynamic]
version = {attr = "loop_robot._version.__version__"}
