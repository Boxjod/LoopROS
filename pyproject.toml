[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-ros"
version = "0.1.0"
description = "Loop Robot Operating System: a terminal-first robotics agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["prompt-toolkit>=3.0.50,<4", "pyserial>=3.5,<4; sys_platform == 'win32' or sys_platform == 'darwin'"]

[project.optional-dependencies]
feetech = ["pyserial>=3.5,<4"]
sim = ["mujoco>=3.3,<4", "numpy>=1.26"]
kinematics = ["mink>=1,<2"]
test = ["pyte>=0.8,<1"]

[project.scripts]
loop = "loop_robot.launcher:main"
loop-switch = "loop_robot.launcher:switch_main"
looper = "loop_robot.launcher:main"
looper-switch = "loop_robot.launcher:switch_main"

[tool.setuptools]
packages = ["loop_robot", "loop_robot.core", "loop_robot.terminal", "loop_robot.toolchain"]
package-dir = {loop_robot = "."}
include-package-data = false

[tool.setuptools.package-data]
loop_robot = ["config.example.json", "config.gpt6.example.json", "agents.json", "task_runtime.json", "examples/*.xml", "examples/deployments/*.json", "logo.png"]
"loop_robot.toolchain" = ["hardware_targets.json"]
