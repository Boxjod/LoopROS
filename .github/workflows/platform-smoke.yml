name: Platform terminal smoke (not hardware certification)
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  terminal:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: loop --version
      - run: loop ros --once /status
      - run: python -m unittest discover -s tests -p test_platform_support.py -v
      - run: python -m unittest discover -s tests -p test_branding.py -v
      - run: python -m unittest discover -s tests -p test_terminal.py -v
